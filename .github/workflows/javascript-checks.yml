name: JavaScript checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build application bundles
        run: npm run build
      - name: Verify generated bundles are committed
        run: git diff --exit-code -- js/core.js js/app.js js/parseworker.js
      - name: Check JavaScript syntax
        run: |
          node --check js/core.js
          node --check js/coi-engine.js
          node --check js/science-engine.js
          node --check js/pdf-engine.js
          node --check js/file-error.js
          node --check js/scanned-pdf-ocr.js
          node --check js/parseworker.js
          node --check js/app.js
      - name: Run unit tests
        run: npm test
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser integration test
        run: npm run test:browser
